name: azsdk-cli - Test

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/azsdk-cli-tests.yml
      - tools/azsdk-cli/**
  pull_request:
    paths:
      - .github/workflows/azsdk-cli-tests.yml
      - tools/azsdk-cli/**

jobs:
  azsdk-cli:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20, 22]
        exclude:
          - os: ubuntu-latest
            node-version: 22
          - os: windows-latest
            node-version: 20

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows
            tools/azsdk-cli

      - run: dotnet test
        working-directory: tools/azsdk-cli
